# ============================================================
# Hybrid MobileSAM + CLIP + GatedFusion RT-DETR
#
# FULL END-TO-END TRAINING (v2 backbone)
#
# Architecture:
#
#                  RGB
#                   |
#          +--------+--------+
#          |                 |
#      MobileSAM           CLIP
#       Encoder           Encoder
#          |                 |
#          +--------+--------+
#                   |
#              GatedFusion
#                   |
#              +----+----+
#              |    |    |
#             P3   P4   P5
#              |    |    |
#              +----+----+
#                   |
#            RT-DETR Decoder
#                   |
#                Output
#
# NO RT-DETR AIFI
# NO RT-DETR Encoder
#
# MobileSAM:
#   FULLY TRAINABLE
#
# CLIP:
#   ViT-B/32
#   FULLY TRAINABLE
#   input_res=384 (v2: full letterboxed image, no center crop)
#
# Fusion (v2):
#   hd=256      (was 192 - matches RT-DETR's own hidden dim, more
#                capacity to use the now-uncropped CLIP signal)
#   clip_dim=768
#   heads=8     (was 6 - 32 per head, unchanged head size)
#   dropout=0.1
#   detail branch: pretrained ResNet-18 stem (defaults on, no
#   yaml change needed - trainable=True, pretrained=True)
# ============================================================

nc: 5


# ============================================================
# BACKBONE
# ============================================================

backbone:

  # ----------------------------------------------------------
  # 0
  # MobileSAM TinyViT
  #
  # [checkpoint, train_mode, train_blocks]
  #
  # "full" = every MobileSAM encoder parameter trainable
  # train_blocks is ignored in full mode
  # ----------------------------------------------------------

  - [-1, 1, MobileSAMEncoder, [null, "full", 0]]


  # ----------------------------------------------------------
  # 1
  # CLIP ViT-B/32
  #
  # [variant, train_mode, train_blocks, input_res]
  #
  # "full" = every CLIP vision parameter trainable
  # input_res=384 is NEW in v2: full letterboxed image at higher
  # resolution instead of a 224x224 center crop. 336/448 are also
  # valid (must be a multiple of the patch size); higher = more
  # detail, more VRAM, roughly quadratic in attention cost.
  #
  # CLIP receives d["img"], i.e. the ORIGINAL RGB image.
  # Therefore MobileSAM and CLIP remain parallel.
  # ----------------------------------------------------------

  - [-1, 1, CLIPEncoder, ["base32", "full", 0, 384]]


  # ----------------------------------------------------------
  # 2
  # Gated Fusion
  #
  # [hd, clip_dim, heads, dropout]
  #
  # hd=256, heads=8 in v2 (was 192/6). detail_trainable and
  # detail_pretrained are the 5th/6th args and default to
  # True/True if omitted, so no change needed here to get the
  # pretrained ResNet-18 detail stem.
  #
  # MobileSAM + CLIP
  # Bidirectional cross-attention
  # Spatial gated fusion
  # Global CLIP context
  # ----------------------------------------------------------

  - [-1, 1, GatedFusion, [256, 768, 8, 0.1]]


  # ----------------------------------------------------------
  # 3
  # P3
  # ----------------------------------------------------------

  - [2, 1, Index, [256, 0]]


  # ----------------------------------------------------------
  # 4
  # P4
  # ----------------------------------------------------------

  - [2, 1, Index, [256, 1]]


  # ----------------------------------------------------------
  # 5
  # P5
  # ----------------------------------------------------------

  - [2, 1, Index, [256, 2]]


# ============================================================
# HEAD
#
# NO AIFI
# NO RT-DETR ENCODER
#
# Only:
#
#   P3/P4/P5
#       ↓
#   channel projection
#       ↓
#   RT-DETR Decoder
# ============================================================

head:

  # ----------------------------------------------------------
  # 6
  # P3: 256 -> 256
  # (v2: fusion already outputs 256, so this is now a no-op
  # projection - kept for symmetry / easy future hd changes)
  # ----------------------------------------------------------

  - [3, 1, Conv, [256, 1, 1, None, 1, 1, False]]


  # ----------------------------------------------------------
  # 7
  # P4: 256 -> 256
  # ----------------------------------------------------------

  - [4, 1, Conv, [256, 1, 1, None, 1, 1, False]]


  # ----------------------------------------------------------
  # 8
  # P5: 256 -> 256
  # ----------------------------------------------------------

  - [5, 1, Conv, [256, 1, 1, None, 1, 1, False]]


  # ----------------------------------------------------------
  # 9
  # RT-DETR Decoder
  #
  # Directly receives P3/P4/P5.
  #
  # NO AIFI.
  # ----------------------------------------------------------

  - [[6, 7, 8], 1, RTDETRDecoder, [nc]]
# ============================================================
# MobileSAM-only RT-DETR (v2)
#
# RGB
#   |
#   MobileSAM TinyViT
#   |
#   SingleEncoderPyramid
#   |
#   P3 / P4 / P5
#   |
#   RT-DETR Decoder
#
# NO CLIP
# NO GatedFusion
# NO AIFI
# NO RT-DETR Encoder
# ============================================================

nc: 5


# ============================================================
# BACKBONE
# ============================================================

backbone:

  # ----------------------------------------------------------
  # 0
  # MobileSAM TinyViT
  #
  # [checkpoint, train_mode, train_blocks]
  #
  # "full" = every MobileSAM encoder parameter trainable
  # ----------------------------------------------------------

  - [-1, 1, MobileSAMEncoder, [null, "full", 0]]


  # ----------------------------------------------------------
  # 1
  # Convert MobileSAM feature map -> P3/P4/P5
  #
  # MobileSAM image encoder output = 256 channels
  # Output channels = 256 (was 192 - matches RT-DETR's own
  # hidden dim, makes the head projection below a no-op)
  # ----------------------------------------------------------

  - [-1, 1, SingleEncoderPyramid, [256, 256, "mobile_sam"]]


  # ----------------------------------------------------------
  # 2
  # P3
  # ----------------------------------------------------------

  - [1, 1, Index, [256, 0]]


  # ----------------------------------------------------------
  # 3
  # P4
  # ----------------------------------------------------------

  - [1, 1, Index, [256, 1]]


  # ----------------------------------------------------------
  # 4
  # P5
  # ----------------------------------------------------------

  - [1, 1, Index, [256, 2]]


# ============================================================
# HEAD
# ============================================================

head:

  # ----------------------------------------------------------
  # 5
  # P3 projection: 256 -> 256
  # ----------------------------------------------------------

  - [2, 1, Conv, [256, 1, 1, None, 1, 1, False]]


  # ----------------------------------------------------------
  # 6
  # P4 projection: 256 -> 256
  # ----------------------------------------------------------

  - [3, 1, Conv, [256, 1, 1, None, 1, 1, False]]


  # ----------------------------------------------------------
  # 7
  # P5 projection: 256 -> 256
  # ----------------------------------------------------------

  - [4, 1, Conv, [256, 1, 1, None, 1, 1, False]]


  # ----------------------------------------------------------
  # 8
  # RT-DETR Decoder
  # ----------------------------------------------------------

  - [[5, 6, 7], 1, RTDETRDecoder, [nc]]

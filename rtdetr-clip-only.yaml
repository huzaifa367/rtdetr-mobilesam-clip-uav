# ============================================================
# CLIP-only RT-DETR (v2)
#
# RGB
#   |
#   CLIP ViT-B/32 (v2: full letterboxed image, no center crop)
#   |
#   SingleEncoderPyramid
#   |
#   P3 / P4 / P5
#   |
#   RT-DETR Decoder
#
# NO MobileSAM
# NO GatedFusion
# NO AIFI
# NO RT-DETR Encoder
# ============================================================

nc: 5


# ============================================================
# BACKBONE
# ============================================================

backbone:

  # ----------------------------------------------------------
  # 0
  # CLIP ViT-B/32
  #
  # [variant, train_mode, train_blocks, input_res]
  #
  # "full" = every CLIP vision parameter trainable
  # input_res=384 is NEW in v2: full letterboxed image at higher
  # resolution instead of a 224x224 center crop.
  # ----------------------------------------------------------

  - [-1, 1, CLIPEncoder, ["base32", "full", 0, 384]]


  # ----------------------------------------------------------
  # 1
  # Convert CLIP tokens -> P3/P4/P5
  #
  # CLIP ViT-B/32 hidden size = 768
  # Output channels = 256 (was 192 - matches RT-DETR's own
  # hidden dim, makes the head projection below a no-op)
  # ----------------------------------------------------------

  - [-1, 1, SingleEncoderPyramid, [768, 256, "clip"]]


  # ----------------------------------------------------------
  # 2
  # P3
  # ----------------------------------------------------------

  - [1, 1, Index, [256, 0]]


  # ----------------------------------------------------------
  # 3
  # P4
  # ----------------------------------------------------------

  - [1, 1, Index, [256, 1]]


  # ----------------------------------------------------------
  # 4
  # P5
  # ----------------------------------------------------------

  - [1, 1, Index, [256, 2]]


# ============================================================
# HEAD
# ============================================================

head:

  # ----------------------------------------------------------
  # 5
  # P3 projection: 256 -> 256
  # ----------------------------------------------------------

  - [2, 1, Conv, [256, 1, 1, None, 1, 1, False]]


  # ----------------------------------------------------------
  # 6
  # P4 projection: 256 -> 256
  # ----------------------------------------------------------

  - [3, 1, Conv, [256, 1, 1, None, 1, 1, False]]


  # ----------------------------------------------------------
  # 7
  # P5 projection: 256 -> 256
  # ----------------------------------------------------------

  - [4, 1, Conv, [256, 1, 1, None, 1, 1, False]]


  # ----------------------------------------------------------
  # 8
  # RT-DETR Decoder
  # ----------------------------------------------------------

  - [[5, 6, 7], 1, RTDETRDecoder, [nc]]

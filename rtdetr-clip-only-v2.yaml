# ============================================================
# CLIP-only RT-DETR (v3)
#
# RGB
#   |
#   CLIP ViT-B/16 @ 640 (v3: 40x40 patch grid, full letterboxed image)
#   |
#   SingleEncoderPyramid
#   |
#   P3 / P4 / P5
#   |
#   RT-DETR Decoder
#
# NO MobileSAM
# NO GatedFusion
# NO AIFI
# NO RT-DETR Encoder
# ============================================================

nc: 5


# ============================================================
# BACKBONE
# ============================================================

backbone:

  # ----------------------------------------------------------
  # 0
  # CLIP ViT-B/16
  #
  # [variant, train_mode, train_blocks, input_res]
  #
  # v2 changes (fix for near-zero mAP / NaN):
  #  - base32 -> base16: 16 px patches instead of 32 px
  #  - input_res 384 -> 640: 40x40 patch grid, so the pyramid is
  #    P3/P4/P5 = 40/20/10 (was 12/6/3), same scale as the
  #    MobileSAM and ConvNeXt baselines that trained fine
  #  - "full" -> "partial", 4: train only the last 4 CLIP blocks
  #    so the pretrained features are not destroyed early
  #  - if GPU memory runs out, use input_res=512 (32/16/8 grid)
  # ----------------------------------------------------------

  - [-1, 1, CLIPEncoder, ["base16", "partial", 4, 640]]


  # ----------------------------------------------------------
  # 1
  # Convert CLIP tokens -> P3/P4/P5
  #
  # CLIP ViT-B/16 hidden size = 768 (same as B/32)
  # Output channels = 256 (was 192 - matches RT-DETR's own
  # hidden dim, makes the head projection below a no-op)
  # ----------------------------------------------------------

  - [-1, 1, SingleEncoderPyramid, [768, 256, "clip"]]


  # ----------------------------------------------------------
  # 2
  # P3
  # ----------------------------------------------------------

  - [1, 1, Index, [256, 0]]


  # ----------------------------------------------------------
  # 3
  # P4
  # ----------------------------------------------------------

  - [1, 1, Index, [256, 1]]


  # ----------------------------------------------------------
  # 4
  # P5
  # ----------------------------------------------------------

  - [1, 1, Index, [256, 2]]


# ============================================================
# HEAD
# ============================================================

head:

  # ----------------------------------------------------------
  # 5
  # P3 projection: 256 -> 256
  # ----------------------------------------------------------

  - [2, 1, Conv, [256, 1, 1, None, 1, 1, False]]


  # ----------------------------------------------------------
  # 6
  # P4 projection: 256 -> 256
  # ----------------------------------------------------------

  - [3, 1, Conv, [256, 1, 1, None, 1, 1, False]]


  # ----------------------------------------------------------
  # 7
  # P5 projection: 256 -> 256
  # ----------------------------------------------------------

  - [4, 1, Conv, [256, 1, 1, None, 1, 1, False]]


  # ----------------------------------------------------------
  # 8
  # RT-DETR Decoder
  # ----------------------------------------------------------

  - [[5, 6, 7], 1, RTDETRDecoder, [nc]]
